name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested new/old APK
        type: boolean
        default: false
  push:
    branches: [main, master, fix/data-preserving-updates]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to publish
        id: mode
        env:
          APP_PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        run: echo "publish=$APP_PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Prepare previous published version
        run: |
          python3 scripts/prepare_versions.py
          python3 scripts/check_release.py
      - name: Read current version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('version=' + json.load(open('new/version.json'))['version'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare APK signature
        env:
          APP_PUBLISH: ${{ steps.mode.outputs.publish }}
          APP_SIGNING_BUNDLE: ${{ steps.mode.outputs.publish == 'true' && secrets.APP_SIGNING_BUNDLE || '' }}
        run: python3 scripts/prepare_signing.py
      - name: Test and build both versions
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Check APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: X-tool-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: previous-source
          path: old/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/movie-audio-signing.jks"
  transport-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_RUNTIME_ABI: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare previous version
        run: python3 scripts/prepare_versions.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android transport smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Keep Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-transport-test
          path: app/build/reports/androidTests/
          retention-days: 7
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    needs: [build, transport-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clear previous-source destination
        run: rm -rf old
      - uses: actions/download-artifact@v4
        with:
          name: previous-source
          path: old
      - uses: actions/download-artifact@v4
        with:
          name: X-tool-APK
          path: dist
      - name: Persist the prepared previous slot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add old
          if ! git diff --cached --quiet; then
            git commit -m 'Rotate previous published version into old [skip ci]'
            git push origin HEAD:main
          fi
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv dist/app-release.apk "dist/MOVIE-AUDIO-TOOL-v$APP_VERSION.apk"
          previous_version=$(python3 -c "import json; print(json.load(open('old/version.json'))['version'])")
          python3 - <<'PY' > /tmp/x-tool-release.md
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          print(text.split('\n## ', 2)[1].split('\n', 1)[1])
          print('\nAndroid 10以降・arm64向け。APKを使用してください。実機確認は未完了です。')
          PY
          target_sha=$(git rev-parse HEAD)
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" "dist/MOVIE-AUDIO-TOOL-v$APP_VERSION.apk" --clobber
            gh release edit "v$APP_VERSION" --notes-file /tmp/x-tool-release.md --prerelease --target "$target_sha"
          else
            gh release create "v$APP_VERSION" "dist/MOVIE-AUDIO-TOOL-v$APP_VERSION.apk" --title "MOVIE&AUDIO-TOOL v$APP_VERSION" --notes-file /tmp/x-tool-release.md --prerelease --target "$target_sha"
          fi
      - name: Publish update manifest after APK is available
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY' > /tmp/x-tool-update.json
          import json, os, hashlib
          from pathlib import Path
          version = os.environ['APP_VERSION']
          previous = json.loads(Path('old/version.json').read_text())['version']
          notes = Path('CHANGELOG.md').read_text().split('\n## ', 2)[1].split('\n', 1)[1]
          apk = Path('dist') / f'MOVIE-AUDIO-TOOL-v{version}.apk'
          apk_info = {'url': f'https://github.com/muya-nakama/X-tool/releases/download/v{version}/{apk.name}', 'bytes': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'versionCode': json.loads(Path('new/version.json').read_text())['versionCode']}
          print(json.dumps({'apk': apk_info, 'version': version, 'url': f'https://github.com/muya-nakama/X-tool/releases/tag/v{version}', 'notes': notes, 'previous': {'version': previous, 'url': f'https://github.com/muya-nakama/X-tool/releases/tag/v{previous}'}}))
          PY
          manifest_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/app-update.json?ref=main" --jq .sha)
          manifest_content=$(base64 -w0 /tmp/x-tool-update.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/app-update.json" -f message='Publish update manifest after APK [skip ci]' -f sha="$manifest_sha" -f content="$manifest_content" -f branch=main
